# OpenClaw Platform Adapter for rpa-ipa-analyzer
#
# Copy this file to ~/.openclaw/skills/rpa-ipa-analyzer/skill.yaml
# along with the rest of the skill files.

name: rpa-ipa-analyzer
version: 3.2.0
description: >-
  Analyze, incrementally update, or audit IPA Studio RPA projects
  (modes: analyze / update / audit).

entrypoint: SKILL.md

runtime:
  type: python
  min_version: "3.8"

actions:
  extract:
    command: python3 scripts/extract_nodes.py
    args:
      - name: project_path
        type: path
        required: true
      - name: force
        type: flag
        required: false
