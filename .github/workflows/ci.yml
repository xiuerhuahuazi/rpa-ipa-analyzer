name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'designs/**'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'designs/**'
      - 'docs/**'
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify extract_nodes.py subcommand stubs
        run: |
          echo "PWD: $(pwd)"
          python "${GITHUB_WORKSPACE}/scripts/extract_nodes.py" --help

      - name: Prepare golden baseline extracted nodes
        run: |
          if [ -f "${GITHUB_WORKSPACE}/evals/golden/baseline_project/.extracted_nodes/manifest.json" ]; then
            echo 'Golden manifest already present, skipping generation.'
            exit 0
          fi
          echo 'Generating extracted nodes for golden baseline...'
          python "${GITHUB_WORKSPACE}/scripts/extract_nodes.py" extract "${GITHUB_WORKSPACE}/evals/golden/baseline_project" --force
          ls -la "${GITHUB_WORKSPACE}/evals/golden/baseline_project/.extracted_nodes/"

      - name: Run evals
        run: |
          python "${GITHUB_WORKSPACE}/evals/evals_runner.py" --all

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax (all .py files)
        run: |
          find . -name '*.py' -print0 | while IFS= read -r -d '' f; do
            python -m py_compile "$f" && echo "OK: $f"
          done
