name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'designs/**'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'designs/**'
      - 'docs/**'
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify extract_nodes.py subcommand stubs
        run: |
          if [ -f scripts/extract_nodes.py ]; then
            python scripts/extract_nodes.py --help
          elif [ -f rpa-ipa-analyzer/scripts/extract_nodes.py ]; then
            python rpa-ipa-analyzer/scripts/extract_nodes.py --help
          else
            echo "ERROR: extract_nodes.py not found. Listing root:"
            ls -la
            echo "--- Recursive ---"
            ls -R
            exit 1
          fi

      - name: Prepare golden baseline extracted nodes
        run: |
          if [ -f evals/golden/baseline_project/.extracted_nodes/manifest.json ]; then
            echo 'Golden manifest already present, skipping generation.'
            exit 0
          fi
          echo 'Generating extracted nodes for golden baseline...'
          if [ -f scripts/extract_nodes.py ]; then
            python scripts/extract_nodes.py extract evals/golden/baseline_project --force
            ls -la evals/golden/baseline_project/.extracted_nodes/
          elif [ -f rpa-ipa-analyzer/scripts/extract_nodes.py ]; then
            python rpa-ipa-analyzer/scripts/extract_nodes.py extract rpa-ipa-analyzer/evals/golden/baseline_project --force
            ls -la rpa-ipa-analyzer/evals/golden/baseline_project/.extracted_nodes/
          else
            echo 'ERROR: extract_nodes.py not found, cannot prepare golden manifest.'
            exit 1
          fi

      - name: Run evals
        run: |
          if [ -f evals/evals_runner.py ]; then
            python evals/evals_runner.py --all
          elif [ -f rpa-ipa-analyzer/evals/evals_runner.py ]; then
            python rpa-ipa-analyzer/evals/evals_runner.py --all
          else
            echo "ERROR: evals_runner.py not found. Listing root:"
            ls -la
            echo "--- Recursive ---"
            ls -R
            exit 1
          fi

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax (all .py files)
        run: |
          find . -name '*.py' -print0 | while IFS= read -r -d '' f; do
            python -m py_compile "$f" && echo "OK: $f"
          done
