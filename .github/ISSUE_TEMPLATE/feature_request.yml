name: 功能请求
description: 建议新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出新想法！请描述你的使用场景，帮助我们设计更好的方案。

  - type: textarea
    id: problem
    attributes:
      label: 背景与动机
      description: 这个功能解决什么问题？请描述你遇到的具体场景
      placeholder: |
        例如：分析 Data Processing 类项目时，我经常需要...

  - type: textarea
    id: proposal
    attributes:
      label: 功能描述
      description: 你期望的功能是什么样的？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的替代方案或临时解决方法？

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 仅 rpa-ipa-analyzer（全量分析）
        - 仅 rpa-ipa-update（增量更新）
        - 两者都需要
        - 其他

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索已有 Issue，确认没有重复请求
          required: true
