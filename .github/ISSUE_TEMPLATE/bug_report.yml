name: Bug 报告
description: 报告 rpa-ipa-analyzer 的问题或异常行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间报告 Bug！请尽可能填写以下信息，帮助我们快速定位问题。

  - type: input
    id: version
    attributes:
      label: 技能版本
      description: 运行 `cat ~/.claude/skills/rpa-ipa-analyzer/VERSION` 查看版本号
      placeholder: 例如 3.0.0
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python 版本
      description: 运行 `python3 --version` 查看
      placeholder: 例如 Python 3.11.4
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 运行平台
      options:
        - Claude Code
        - OpenAI Codex
        - OpenClaw
        - 其他
    validations:
      required: true

  - type: dropdown
    id: depth
    attributes:
      label: 分析深度
      description: 使用了哪种分析深度？
      options:
        - quick
        - standard
        - deep
        - 未使用分析命令

  - type: textarea
    id: project-info
    attributes:
      label: IPA 项目信息
      description: 被分析 RPA 项目的概况
      placeholder: |
        项目类型：Data Processing / Web Automation / Mixed
        节点数量（约）：
        流程文件数量：

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 一步步描述如何触发该问题
      placeholder: |
        1. 运行命令 `...`
        2. 查看文件 `...`
        3. 出现错误 `...`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？请粘贴完整的错误信息或截图
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志/输出
      description: 粘贴 `extract_nodes.py` 输出、manifest.json 摘要、或 Claude Code 对话记录
      render: shell
